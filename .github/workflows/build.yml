name: Verificar aplicativo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-build:
    name: Testes e compilação (sem publicar na Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências conforme lockfile
        run: npm ci

      - name: Executar todos os testes
        run: npm test

      - name: Compilar Next.js
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
