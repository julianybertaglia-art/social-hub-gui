name: Executar disparo dos cinco áudios agora

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-send-five-now.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar rota única
        run: |
          curl --fail-with-body --silent --show-error \
            'https://social-hub-gui.vercel.app/api/whatsapp/send-five-now'
