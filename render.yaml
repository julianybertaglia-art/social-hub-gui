services:
  - type: web
    name: lynna-whatsapp-bridge
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./whatsapp-bridge/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: commit
    disk:
      name: whatsapp-session
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "3000"
      - key: AUTH_DIR
        value: /data/auth
      - key: MESSAGE_CACHE_FILE
        value: /data/message-cache.json
      - key: SESSION_LOCK_FILE
        value: /data/bridge.lock
      - key: AUTO_CONNECT
        value: "true"
      - key: LOG_LEVEL
        value: warn
      - key: BRIDGE_WEBHOOK_URL
        value: https://social-hub-gui.vercel.app/api/whatsapp/bridge/webhook
      - key: BRIDGE_API_TOKEN
        generateValue: true
