name: Inspect Event Direct Targets Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/send-event-directs-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect approved Instagram recipients without sending
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 80 https://social-hub-gui.vercel.app/api/instagram/event-direct-replies
          printf '\n'
