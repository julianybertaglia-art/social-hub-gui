name: Check WhatsApp Gato now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-gato-now.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          curl --fail-with-body --silent --show-error             'https://social-hub-gui.vercel.app/api/whatsapp/gato'
