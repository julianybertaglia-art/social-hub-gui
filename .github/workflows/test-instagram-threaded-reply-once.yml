name: Test Instagram threaded reply once

on:
  push:
    branches:
      - rebrand-tideplace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deploy
        run: sleep 35
      - name: Test threaded reply
        run: |
          set -euo pipefail
          BODY="$(curl --silent --show-error -X POST             -H "x-tideplace-thread-key: tp-thread-test-20260930"             "https://social-hub-gui.vercel.app/api/instagram/threaded-reply-test")"
          echo "$BODY"
