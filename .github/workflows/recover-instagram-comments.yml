name: Recuperar comentários do Instagram
# A execução por push também confirma a integração quando este fluxo é atualizado.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-instagram-comments.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: recover-instagram-comments
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Obter autorização temporária
        id: oidc
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=social-hub-instagram-recovery")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Recuperar comentários pendentes
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              'https://social-hub-gui.vercel.app/api/instagram/comment-automations/recover'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
