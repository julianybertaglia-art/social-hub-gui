const icon=(name,size=19)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.spark}"/></svg>`;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const account={'gui-nonato':{name:'Gui Nonato',handle:'@gui_nonato',initials:'GN',niche:'E-commerce e marketplaces'},'vital-decor':{name:'Vital Decor',handle:'@vitaldecor_',initials:'VD',niche:'Decoração e transformação de ambientes'}};
const editorial={
 '18125373164303662':{topic:'Aprendizado na prática',angle:'O gancho vende uma transformação concreta: sair com algo pronto. Dá para adaptar isso a uma análise prática da operação.',hook:'3 decisões que mudam sua operação depois de uma análise de conta',label:'Resultado concreto',slides:['Capa: 3 decisões que mudam sua operação','O que os números da sua conta revelam','Como escolher uma prioridade de ação','O que ajustar antes de investir mais','CTA: comente MENTORIA para conversar com a equipe']},
 '18123522742912195':{topic:'Aprendizado na prática',angle:'Uma promessa prática e específica facilita entender o valor da experiência. Use uma demonstração real do método do Gui.',hook:'O que eu analisaria antes de escalar uma conta no Mercado Livre',label:'Método demonstrado',slides:['Capa: antes de escalar, eu olharia isso','O produto e a margem da operação','A qualidade da oferta e do anúncio','O estoque e a capacidade de entrega','CTA: salve para revisar sua operação']},
 '17870865066649273':{topic:'Conteúdo que converte',angle:'O conteúdo conecta audiência com destino de venda. Uma boa pauta para mostrar o caminho entre alcance, oferta e atendimento.',hook:'Seu Instagram traz gente. Sua oferta transforma essa atenção em venda?',label:'Problema + diagnóstico',slides:['Capa: atenção não é o mesmo que venda','Como está a sua oferta?','Para onde você manda quem se interessa?','O atendimento ajuda a pessoa a decidir?','CTA: salve este checklist antes de publicar']},
 '18057461210567437':{topic:'Decoração por possibilidades',angle:'A comparação por faixas de orçamento simplifica a escolha. A Vital pode usar essa lógica para mostrar alternativas de transformação.',hook:'3 formas de transformar uma parede sem reforma',label:'Comparação de opções',slides:['Capa: 3 formas de transformar sua parede','Opção 1: destaque com jardim vertical','Opção 2: textura com revestimento 3D','Opção 3: renovar com revestimento adesivo','CTA: fale com a equipe e escolha a sua']},
 '17991572118105379':{topic:'Decoração por possibilidades',angle:'O post reúne peças numa composição completa. Para a Vital, a inspiração está em mostrar como textura e verde trabalham juntos.',hook:'Sua sala parece incompleta? Pode estar faltando textura.',label:'Composição de ambiente',slides:['Capa: sua sala parece incompleta?','Observe cores, luz e materiais','Escolha uma parede de destaque','Combine textura com um toque de verde','CTA: salve esta ideia para o seu ambiente']},
 '18112559300154021':{topic:'Preparação para a Black Friday',angle:'Uma campanha sazonal fica mais clara quando destaca o que a pessoa pode aproveitar. A pauta pode preparar a compra sem inventar ofertas.',hook:'3 coisas para organizar antes de comprar decoração na Black Friday',label:'Pauta sazonal',slides:['Capa: prepare sua lista de decoração','Escolha o ambiente que quer renovar','Tire as medidas antes de comprar','Defina uma lista e um orçamento','CTA: salve para consultar durante a Black Friday']}
};
const state={workspace:'gui-nonato',page:'dashboard',type:'all',search:'',sort:'recent',slides:{}};
const readIdeas=()=>{try{const value=JSON.parse(localStorage.getItem('tideplace-radar-preview-v1:'+state.workspace)||'[]');return Array.isArray(value)?value:[]}catch{return[]}};
const writeIdeas=items=>localStorage.setItem('tideplace-radar-preview-v1:'+state.workspace,JSON.stringify(items));
const posts=()=>DATA.posts.filter(p=>p.workspace===state.workspace);
const meta=p=>editorial[p.id]||{topic:'Referência do nicho',angle:'Uma referência para explorar gancho, sequência e abordagem da marca.',hook:p.caption.split('\n')[0].slice(0,120),label:'Referência de conteúdo',slides:['Capa: apresente um problema do público','Contexto: por que isso merece atenção','Explique uma ideia prática','Mostre um exemplo da sua marca','Feche com uma próxima ação']};
const date=value=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',timeZone:'America/Sao_Paulo'}).format(new Date(value));
const format=p=>p.type==='CAROUSEL_ALBUM'?'Carrossel':p.type==='VIDEO'?'Reel':'Imagem';
const number=value=>value==null?'—':new Intl.NumberFormat('pt-BR').format(value);
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3200)}
function sourceLink(p){try{const url=new URL(p.url);return url.protocol==='https:'&&['instagram.com','www.instagram.com'].includes(url.hostname)?url.href:'#'}catch{return'#'}}
function image(p,index=0){const value=p.images?.[index]||'';return /^\/radar-preview\/\d+\.jpg$/.test(value)?value:''}
function isSaved(p){return readIdeas().some(i=>i.sourceId===p.id&&i.kind==='reference')}
function postCard(p){const m=meta(p),index=state.slides[p.id]||0,images=p.images||[],saved=isSaved(p);return`<article class="post"><div class="post-top"><div class="profile-label"><span class="mini-avatar">${p.workspace==='gui-nonato'?'EN':'M'}</span><div><strong>@${escapeHtml(p.handle)}</strong><small>${date(p.publishedAt)}</small></div></div><button class="save-button ${saved?'saved':''}" data-action="save" data-id="${p.id}" aria-label="${saved?'Remover referência salva':'Salvar referência'}" aria-pressed="${saved}">${icon('bookmark',20)}</button></div><div class="post-image"><img src="${image(p,index)}" alt="${escapeHtml(p.profileName)} · ${format(p)} · imagem ${index+1}" loading="lazy"><span class="format">${format(p)}</span>${images.length>1?`<span class="slide-count">${index+1}/${images.length}</span><button class="slide-control prev" data-action="slide" data-id="${p.id}" data-step="-1" aria-label="Imagem anterior">${icon('left',17)}</button><button class="slide-control next" data-action="slide" data-id="${p.id}" data-step="1" aria-label="Próxima imagem">${icon('right',17)}</button><div class="dots" aria-hidden="true">${images.map((_,i)=>`<span class="${i===index?'on':''}"></span>`).join('')}</div>`:''}${p.type==='VIDEO'?`<a class="video-open" href="${sourceLink(p)}" target="_blank" rel="noopener noreferrer" aria-label="Assistir ao vídeo no Instagram">▶</a>`:''}</div><div class="post-body"><div class="post-metrics"><span>${icon('heart',16)} ${number(p.likes)}</span><span>${icon('comment',16)} ${number(p.comments)}</span></div><p class="caption">${escapeHtml(p.caption.slice(0,190))}</p><div class="analysis"><small>O QUE PODE VIRAR CONTEÚDO</small><p>${escapeHtml(m.angle)}</p></div><div class="post-actions"><button class="primary" data-action="brief" data-id="${p.id}" data-mode="inspiration">${icon('spark',17)} Se inspirar nesse post</button><button class="secondary" data-action="brief" data-id="${p.id}" data-mode="structure">${icon('layers',16)} Usar essa estrutura</button></div><div class="post-footer"><span>${escapeHtml(m.label)}</span><a href="${sourceLink(p)}" target="_blank" rel="noopener noreferrer">Ver original ↗</a></div></div></article>`}
function filtered(){const term=state.search.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return posts().filter(p=>(state.type==='all'||p.type===state.type)&&(!term||(p.caption+' '+p.handle+' '+meta(p).topic+' '+meta(p).hook).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(term))).sort((a,b)=>state.sort==='engagement'?((b.likes||0)+(b.comments||0))-((a.likes||0)+(a.comments||0)):Date.parse(b.publishedAt)-Date.parse(a.publishedAt))}
function renderCards(){const root=document.getElementById('post-grid');if(root)root.innerHTML=filtered().map(postCard).join('')||'<div class="empty" style="grid-column:1/-1"><h3>Nenhuma referência com esse filtro.</h3><p>Tente outro assunto ou selecione todos os formatos.</p></div>'}
function notice(){return`<div class="preview-notice">${icon('clock',16)}<span><strong>Prévia com posts reais coletados em ${date(DATA.collectedAt)}.</strong> A pesquisa diária automática será ativada na próxima etapa. As ideias desta tela ficam salvas neste navegador.</span></div>`}
function dashboard(){const p=posts(),topics=[...new Set(p.map(x=>meta(x).topic))];return`${notice()}<div class="hero"><div><span class="eyebrow">Seu assistente de social media</span><h1>Seu próximo post começa aqui.</h1><p>Referências do seu nicho, com um caminho para criar conteúdo da ${account[state.workspace].name}.</p></div><button class="primary" data-action="nav" data-page="feed">Explorar o radar ${icon('arrow',18)}</button></div><div class="overview"><div class="stat"><span class="symbol">${icon('layers',23)}</span><div><strong>${p.length}</strong><span>Posts na coleta de teste</span></div></div><div class="stat"><span class="symbol">${icon('users',23)}</span><div><strong>${new Set(p.map(x=>x.handle)).size}</strong><span>Perfil de referência</span></div></div><div class="stat"><span class="symbol">${icon('spark',23)}</span><div><strong>${topics.length}</strong><span>Assuntos identificados</span></div></div></div><div class="section-head"><div><h2>Em pauta nas suas referências</h2><p>Sinais da amostra coletada para ${account[state.workspace].niche.toLowerCase()}.</p></div></div><div class="topics">${topics.map((topic,i)=>{const matching=p.filter(x=>meta(x).topic===topic),first=matching[0];return`<button class="topic" data-action="topic" data-topic="${escapeHtml(topic)}"><span class="topic-number">0${i+1}</span><span><span class="chip wine">${matching.length} ${matching.length===1?'referência':'referências'}</span><h3>${escapeHtml(topic)}</h3><p>${escapeHtml(meta(first).hook)}</p><span class="next">Ver ideias para essa pauta →</span></span></button>`}).join('')}</div><div class="section-head"><div><h2>Referências para o seu próximo post</h2><p>Explore o formato, salve a ideia e adapte para sua marca.</p></div><button class="text-button" data-action="nav" data-page="feed">Ver feed ${icon('arrow',17)}</button></div><div class="feed-grid">${p.map(postCard).join('')}</div><p class="sample-note">Fonte: API oficial da Meta. A identificação de posts acima do padrão depende de mais coletas e de uma comparação com o histórico de cada perfil.</p>`}
function feed(){return`${notice()}<div class="hero"><div><span class="eyebrow">Radar de conteúdo · ${account[state.workspace].name}</span><h1>Um feed para encontrar boas ideias.</h1><p>Referências selecionadas, com leitura editorial e métricas públicas.</p></div><button class="secondary" data-action="profiles">${icon('users',18)} Perfis acompanhados</button></div><div class="toolbar"><label class="search">${icon('search',19)}<span class="screen-reader">Buscar no feed</span><input id="search" placeholder="Buscar assunto, perfil ou ideia…" value="${escapeHtml(state.search)}"></label><label class="screen-reader" for="sort">Ordenar referências</label><select class="sort" id="sort"><option value="recent" ${state.sort==='recent'?'selected':''}>Mais recentes</option><option value="engagement" ${state.sort==='engagement'?'selected':''}>Mais interações</option></select></div><div class="row between" style="margin-bottom:20px;flex-wrap:wrap"><div class="filters">${[['all','Todos'],['CAROUSEL_ALBUM','Carrosséis'],['VIDEO','Reels'],['IMAGE','Imagens']].map(([type,label])=>`<button class="filter ${state.type===type?'active':''}" data-action="filter" data-type="${type}" aria-pressed="${state.type===type}">${label}</button>`).join('')}</div><span class="muted" style="font-size:13px">${posts().length} posts · ${date(DATA.collectedAt)}</span></div><div class="feed-grid" id="post-grid"></div><p class="sample-note">Esta prévia usa a coleta de teste. “Mais interações” ordena curtidas e comentários disponíveis na amostra.</p>`}
function ideas(){const items=readIdeas();return`${notice()}<div class="hero"><div><span class="eyebrow">Banco de ideias · ${account[state.workspace].name}</span><h1>Boas referências, próximas ações.</h1><p>Suas referências e briefings salvos nesta prévia.</p></div><button class="primary" data-action="nav" data-page="feed">Buscar inspiração ${icon('spark',18)}</button></div>${items.length?`<div class="ideas-grid">${items.map(i=>`<article class="idea"><span class="chip wine">${i.kind==='reference'?'Referência salva':'Briefing de carrossel'}</span><h3>${escapeHtml(i.title)}</h3><p>${escapeHtml(i.audience||'Uma referência para explorar depois.')}</p><p class="source">Referência: <a href="${sourceLink({url:i.sourceUrl})}" target="_blank" rel="noopener noreferrer">@${escapeHtml(i.handle)} ↗</a></p><div class="idea-actions"><button class="text-button" data-action="edit-idea" data-idea-id="${i.id}">Abrir ideia →</button><button class="icon-button" data-action="delete-idea" data-idea-id="${i.id}" aria-label="Remover ideia">✕</button></div></article>`).join('')}</div>`:`<div class="empty">${icon('bookmark',36)}<h3>Seu próximo conteúdo pode começar com uma referência.</h3><p>Salve um post ou monte um briefing a partir do radar.</p><button class="primary" data-action="nav" data-page="feed">Explorar referências</button></div>`}`}
function render(){document.getElementById('content').innerHTML=state.page==='dashboard'?dashboard():state.page==='feed'?feed():ideas();document.getElementById('idea-count').textContent=readIdeas().length;document.querySelectorAll('.nav-item').forEach(el=>{const active=el.dataset.page===state.page;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(state.page==='feed')renderCards()}
function navigate(page){state.page=page;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
let lastFocus,modalPost,editingIdea;
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';lastFocus?.focus()}
function openBrief(p,mode='inspiration',idea=null){lastFocus=document.activeElement;modalPost=p;editingIdea=idea;const m=meta(p),title=idea?.title||m.hook,outline=idea?.outline||m.slides.join('\n\n');document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-top"><span class="eyebrow">${mode==='structure'?'Usar a estrutura':'Transformar em uma ideia'}</span><button class="icon-button" data-action="close-modal" aria-label="Fechar">✕</button></div><h2 id="modal-title">Da referência ao seu carrossel.</h2><p class="muted">Ajuste a abordagem para ${account[state.workspace].name} e guarde o briefing para produzir depois.</p><div class="source-box"><img src="${image(p)}" alt="Referência escolhida"><div><strong>@${escapeHtml(p.handle)} · ${format(p)}</strong><a href="${sourceLink(p)}" target="_blank" rel="noopener noreferrer">Abrir post de referência ↗</a></div></div><form id="brief-form"><label class="field" for="brief-title">Gancho da capa</label><textarea id="brief-title" rows="2" required maxlength="220">${escapeHtml(title)}</textarea><label class="field" for="brief-goal">Objetivo do conteúdo</label><select id="brief-goal">${['Autoridade','Ensinar','Gerar conversa','Vender'].map(goal=>`<option ${idea?.goal===goal?'selected':''}>${goal}</option>`).join('')}</select><label class="field" for="brief-outline">Sequência sugerida dos slides</label><textarea id="brief-outline" rows="10" required maxlength="4000">${escapeHtml(outline)}</textarea><p class="slide-tip">Esta etapa prepara o briefing. A criação das artes será incluída depois.</p><div class="modal-foot"><button type="button" class="secondary" data-action="close-modal">Voltar</button><button class="primary" type="submit">${icon('bookmark',17)} Salvar ideia</button></div></form></section></div>`;document.body.style.overflow='hidden';document.getElementById('brief-title').focus()}
function saveReference(p){const items=readIdeas();if(isSaved(p)){writeIdeas(items.filter(i=>!(i.kind==='reference'&&i.sourceId===p.id)));toast('Referência removida da prévia.')}else{writeIdeas([{id:crypto.randomUUID(),kind:'reference',sourceId:p.id,sourceUrl:p.url,handle:p.handle,title:meta(p).hook,audience:meta(p).angle,createdAt:new Date().toISOString()},...items]);toast('Referência salva nas ideias desta prévia.')}render()}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el){if(event.target.id==='backdrop')closeModal();return}const action=el.dataset.action,p=posts().find(x=>x.id===el.dataset.id);if(action==='nav')navigate(el.dataset.page);if(action==='menu')document.getElementById('sidebar').classList.toggle('open');if(action==='filter'){state.type=el.dataset.type;render()}if(action==='topic'){state.search=el.dataset.topic;state.type='all';navigate('feed')}if(action==='save'&&p)saveReference(p);if(action==='brief'&&p)openBrief(p,el.dataset.mode);if(action==='slide'&&p){const size=p.images.length;state.slides[p.id]=((state.slides[p.id]||0)+Number(el.dataset.step)+size)%size;const card=el.closest('.post');card.outerHTML=postCard(p)}if(action==='close-modal')closeModal();if(action==='delete-idea'){writeIdeas(readIdeas().filter(i=>i.id!==el.dataset.ideaId));render();toast('Ideia removida desta prévia.')}if(action==='edit-idea'){const idea=readIdeas().find(i=>i.id===el.dataset.ideaId),post=posts().find(p=>p.id===idea?.sourceId);if(post)openBrief(post,'inspiration',idea)}if(action==='profiles'){const first=posts()[0];toast('Perfil desta coleta: @'+first.handle+'. A lista poderá ser ampliada no Hub.')}});
document.addEventListener('input',event=>{if(event.target.id==='search'){state.search=event.target.value;renderCards()}});
document.addEventListener('change',event=>{if(event.target.id==='workspace'){closeModal();state.workspace=event.target.value;state.search='';state.type='all';state.slides={};document.getElementById('account-avatar').textContent=account[state.workspace].initials;document.getElementById('account-handle').textContent=account[state.workspace].handle;render()}if(event.target.id==='sort'){state.sort=event.target.value;renderCards()}});
document.addEventListener('submit',event=>{if(event.target.id!=='brief-form')return;event.preventDefault();const title=document.getElementById('brief-title').value.trim(),outline=document.getElementById('brief-outline').value.trim();if(!title||!outline)return;const p=modalPost;const idea={id:editingIdea?.id||crypto.randomUUID(),kind:'brief',sourceId:p.id,sourceUrl:p.url,handle:p.handle,title,outline,goal:document.getElementById('brief-goal').value,audience:meta(p).angle,createdAt:editingIdea?.createdAt||new Date().toISOString()};try{writeIdeas([idea,...readIdeas().filter(i=>i.id!==idea.id)]);closeModal();navigate('ideas');toast('Briefing salvo nas ideias desta prévia.')}catch{toast('Não foi possível salvar. Verifique o armazenamento do navegador.')}});
document.addEventListener('keydown',event=>{const modal=document.querySelector('.modal');if(event.key==='Escape'){closeModal();document.getElementById('sidebar').classList.remove('open')}if(event.key==='Tab'&&modal){const items=[...modal.querySelectorAll('button,a,input,select,textarea')],first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
document.getElementById('collected-label').textContent='Coleta de '+date(DATA.collectedAt);
render();
</script>
</body>
</html>
