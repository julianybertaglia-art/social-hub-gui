name: Validar CRM Vital
on:
  push:
    branches:
      - feat/vital-crm-operational-queues
  workflow_dispatch:
jobs:
  tests-and-build:
    name: Tests and Next build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Compile Next.js
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
