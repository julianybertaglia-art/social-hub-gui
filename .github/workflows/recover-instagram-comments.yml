name: Recuperar comentários do Instagram
# Recuperação de segurança + auto-reparo da assinatura do webhook. Verificação pós-deploy.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-instagram-comments.yml'

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: recover-instagram-comments
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Obter autorização temporária
        id: oidc
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=social-hub-instagram-recovery")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Recuperar comentários pendentes
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          success=false
          response=''
          http_code=''

          for attempt in 1 2 3 4 5 6; do
            tmp="$(mktemp)"
            http_code="$(curl --max-time 45 --silent --show-error \
              -o "$tmp" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              'https://social-hub-gui.vercel.app/api/instagram/comment-automations/recover' || true)"
            response="$(cat "$tmp")"
            rm -f "$tmp"

            if [[ "$http_code" =~ ^2 ]] && printf '%s' "$response" | jq -e '.ok == true' >/dev/null 2>&1; then
              success=true
              break
            fi
            sleep 10
          done

          if [[ "$success" == true ]]; then
            description="$(printf '%s' "$response" | jq -r '"IG recovery: matched=\(.recovery.matched // 0), pending=\(.recovery.pending // 0), recovered=\(.recovery.recovered // 0), failed=\(.recovery.failed // 0)"' | cut -c1-140)"
            state='success'
          else
            detail="$(printf '%s' "$response" | jq -r '.detail // .error // "sem detalhe"' 2>/dev/null || printf 'HTTP %s' "$http_code")"
            description="$(printf 'IG recovery falhou: %.110s' "$detail")"
            state='failure'
          fi

          payload="$(jq -nc --arg state "$state" --arg description "$description" '{state:$state,context:"instagram-recovery",description:$description}')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null || true

          printf '%s\n' "$response"
          [[ "$success" == true ]]
