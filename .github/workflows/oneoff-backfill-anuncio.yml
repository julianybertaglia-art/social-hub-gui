name: One-off ANUNCIO backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-backfill-anuncio.yml'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger missed comment automation
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            'https://social-hub-gui.vercel.app/api/instagram/backfill-anuncio-branc-1980'
