name: Peek last2 live status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/peek-last2-live.yml'

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read template status
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail --max-time 30             'https://social-hub-gui.vercel.app/api/whatsapp/last2-campaign'             | jq '{ok, template_status:(.template.status // null), template_name:(.template.name // null)}'
