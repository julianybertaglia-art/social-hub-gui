name: Audit Instagram Imersao leads now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-instagram-imersao-now.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deploy and fetch audit
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://social-hub-gui.vercel.app/api/instagram/audit-imersao-leads'
          mkdir -p tmp
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/audit.json -w '%{http_code}' --max-time 120 "$endpoint" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true' /tmp/audit.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 8
          done
          cat /tmp/audit.json
          if [ "$ok" != "1" ]; then exit 1; fi
          cp /tmp/audit.json tmp/instagram-imersao-audit.json
      - name: Save audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add tmp/instagram-imersao-audit.json
          git commit -m 'chore: save Instagram Imersao lead audit' || exit 0
          git push
