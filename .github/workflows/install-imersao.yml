name: Instalar áudio da Imersão

on:
  push:
    paths:
      - '.github/workflows/install-imersao.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o Hub
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Permitir menus com dois ou três botões
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/instagram/audio-automation/service.js')
          text = path.read_text(encoding='utf-8')
          old = "if (!text || [...text].length > 640 || !Array.isArray(buttons) || buttons.length !== 3) {"
          new = "if (!text || [...text].length > 640 || !Array.isArray(buttons) || buttons.length < 2 || buttons.length > 3) {"
          if old not in text and new not in text:
              raise SystemExit('Trecho de validação não encontrado.')
          text = text.replace(old, new)
          text = text.replace('Configure a mensagem e os três destinos do menu do Argo.', 'Configure a mensagem e entre dois e três destinos do menu.')
          text = text.replace('Os três botões precisam de títulos curtos e links HTTPS válidos.', 'Os botões precisam de títulos curtos e links HTTPS válidos.')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Salvar o ajuste no Hub
        run: |
          if git diff --quiet; then
            echo 'O ajuste já estava aplicado.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/api/instagram/audio-automation/service.js
            git commit -m 'Permitir dois botões na automação de áudio'
            git push origin HEAD:main
          fi

      - name: Enviar o áudio para o Supabase
        env:
          INSTALL_URL: https://yjcrjoehpexddzqzafmc.supabase.co/functions/v1/upload-audio-imersao?token=qg6A4YF4XyMFienRcBRZdczgiQpwedysHCaH7GLMDzs
        run: |
          response="$(curl --fail --silent --show-error --retry 3 "$INSTALL_URL")"
          echo "$response"
          RESPONSE="$response" python - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          if data.get('ok') is not True or data.get('bytes') != 77749:
              raise SystemExit(f'Falha na instalação: {data}')
          print('Áudio validado e enviado com sucesso.')
          PY
