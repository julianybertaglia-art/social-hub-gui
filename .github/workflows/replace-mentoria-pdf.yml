name: Replace mentoria PDF
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    if: github.event.head_commit.message == 'Atualiza apresentação oficial da mentoria'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official PDF
        run: |
          curl --fail --location 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3ca4-820e-96ef-738a30bdd341/raw?se=2026-09-30T19%3A39%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=81263d1f-6c75-52f9-824d-0f779288f69a&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T12%3A04%3A15Z&ske=2026-10-01T12%3A04%3A15Z&sks=b&skv=2026-02-06&sig=%2BxEL3doU1GbsEECHH1Lv7DmZ%2Bjmgr/1QKjtwNDMCRsU%3D' -o public/mentoria-gui-nonato.pdf
          test "$(stat -c%s public/mentoria-gui-nonato.pdf)" -gt 6000000
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mentoria-gui-nonato.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza PDF oficial da mentoria"
          git push
