name: Repair Instagram public comment once

on:
  push:
    branches:
      - rebrand-tideplace

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deploy
        run: sleep 35
      - name: Repair latest public comment
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error -X POST             -H "x-tideplace-repair-key: tp-public-comment-repair-20260930"             "https://social-hub-gui.vercel.app/api/instagram/public-comment-repair-once")"
          echo "$BODY"
