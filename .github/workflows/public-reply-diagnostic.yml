name: Public reply diagnostic

on:
  push:
    branches:
      - rebrand-tideplace

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call public reply diagnostic
        run: |
          set -euo pipefail
          BODY="$(curl --silent --show-error -X POST             -H "x-tideplace-repair-key: tp-public-reply-20260930"             "https://social-hub-gui.vercel.app/api/instagram/public-reply-repair")"
          echo "$BODY"
