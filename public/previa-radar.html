  if (event.key === 'Tab' && modal) { const items = [...modal.querySelectorAll('button,a,input,select,textarea')], first = items[0], last = items.at(-1); if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); } else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); } }
});
document.addEventListener('error', event => { if (event.target.matches?.('.post-image img')) { event.target.hidden = true; const fallback = event.target.parentElement.querySelector('.image-fallback'); if (fallback) fallback.hidden = false; } }, true);
function validateResearch(value) {
  if (!value || value.schemaVersion !== 1 || !Number.isFinite(Date.parse(value.collectedAt)) || !Array.isArray(value.posts) || value.posts.length > 100 || !Array.isArray(value.profiles)) return false;
  const ids = new Set();
  for (const p of value.posts) {
    if (!p || typeof p.id !== 'string' || !/^[a-zA-Z0-9_-]{1,90}$/.test(p.id) || ids.has(p.id) || !account[p.workspace] || !['followed', 'discovery'].includes(p.origin) || typeof p.caption !== 'string' || typeof p.handle !== 'string' || typeof p.profileName !== 'string' || !['IMAGE', 'VIDEO', 'CAROUSEL_ALBUM', 'ARTICLE'].includes(p.type) || !Number.isFinite(Date.parse(p.publishedAt)) || sourceLink(p) === '#' || !Array.isArray(p.images) || p.images.length > 10) return false;
    if (p.editorial && (typeof p.editorial.topic !== 'string' || typeof p.editorial.hook !== 'string' || typeof p.editorial.angle !== 'string' || typeof p.editorial.label !== 'string' || !Array.isArray(p.editorial.slides) || p.editorial.slides.some(s => typeof s !== 'string'))) return false;
    for (const key of ['likes', 'comments']) if (p[key] != null && (!Number.isFinite(p[key]) || p[key] < 0)) return false;
    ids.add(p.id);
  }
  return value.profiles.every(p => p && account[p.workspace] && typeof p.name === 'string' && typeof p.handle === 'string' && typeof p.reason === 'string');
}
async function refreshResearch() {
  if (typeof fetch !== 'function') return false;
  const controller = typeof AbortController === 'function' ? new AbortController() : null;
  const timeout = controller ? setTimeout(() => controller.abort(), 8000) : null;
  try {
    const response = await fetch('/radar-research.json?v=' + Date.now(), { cache: 'no-store', ...(controller ? { signal: controller.signal } : {}) });
    if (!response.ok) return false;
    const value = await response.json();
    if (!validateResearch(value) || Date.parse(value.collectedAt) < Date.parse(DATA.collectedAt)) return false;
    for (const key of ['posts', 'profiles', 'collectedAt', 'discoveredProfiles', 'automation']) DATA[key] = value[key];
    if (!posts().some(p => p.handle === state.profile)) state.profile = 'all';
    render(); return true;
  } catch { return false; } finally { if (timeout) clearTimeout(timeout); }
}
document.querySelectorAll('#workspace option').forEach(option => option.selected = option.value === state.workspace);
document.getElementById('account-avatar').textContent = account[state.workspace].initials;
document.getElementById('account-handle').textContent = account[state.workspace].handle;
render();
refreshResearch();
</script>
