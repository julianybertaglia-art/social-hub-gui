name: Disparar áudios recentes uma vez

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-recent-audio-batch.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar lote idempotente
        run: |
          curl --fail-with-body --silent --show-error \
            'https://social-hub-gui.vercel.app/api/whatsapp/recent-audio-batch?run=Z9fM-yifmda5XQUuX63cbZ-VPpE1Lbpi'
