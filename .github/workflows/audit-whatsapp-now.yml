name: Audit WhatsApp templates now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-whatsapp-now.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch template audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl --fail-with-body --silent --show-error --max-time 60             'https://social-hub-gui.vercel.app/api/whatsapp/template-audit'             -o tmp/template-audit.json
          cat tmp/template-audit.json
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/template-audit.json
          git commit -m 'chore: save WhatsApp template audit' || exit 0
          git push
