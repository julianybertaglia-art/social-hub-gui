name: Verificar aplicativo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Testar envio restrito de áudio
        run: node --test tests/instagram-audio.test.mjs

      - name: Verificar saudação e atendimento WhatsApp
        run: node --test tests/whatsapp-influencer-automation.test.mjs

      - name: Testar retorno à guia sem carregamento
        run: node --test tests/tideplace-tab-resume.test.mjs

      - name: Testar inbox da Vital Decor e isolamento entre workspaces
        run: node --test tests/vital-whatsapp-inbox.test.mjs

      - name: Testar automação Vivi da Vital Decor
        run: node --test tests/vivi-vital-flow.test.mjs

      - name: Testar bridge TidePlace Argo
        run: node --test tests/argo-vital-bridge.test.mjs

      - name: Testar redirecionamento Direct Vital para WhatsApp
        run: node --test tests/vital-instagram-direct.test.mjs tests/vital-instagram-automation-panel.test.mjs

      - name: Testar build
        run: npm run build
