name: QA visual isolado do CRM
on:
  push:
    branches: ['codex/qa-crm-espacoso-20261111']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright
      - name: Preparar interface com dados fictícios
        run: |
          cp app/HubFrame.js app/hub-frame.module.css app/VitalCRMReal.js app/vital-crm-real.module.css app/VitalStoreCRM.js app/vital-store-crm.module.css qa-crm/app/
          ln -s "$GITHUB_WORKSPACE/node_modules" qa-crm/node_modules
      - name: Exercitar desktop e celular
        working-directory: qa-crm
        run: |
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          ./node_modules/.bin/next dev --webpack --hostname 127.0.0.1 --port 3813 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:3813/crm/vital > /dev/null && break; sleep 2; done
          node check-ui.cjs
      - name: Guardar evidências visuais fictícias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-crm-visual
          path: |
            qa-crm/*.png
            qa-crm/server.log
